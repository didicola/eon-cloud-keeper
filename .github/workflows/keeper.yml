name: EON Cloud Keeper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  keep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Probe fleet, self-heal, report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python keeper.py
      - name: Persist state
        run: |
          git config user.name  "eon-keeper"
          git config user.email "keeper@eon.local"
          git add state || true
          git diff --staged --quiet || git commit -m "keeper: $(date -u +%FT%TZ) fleet state"
          git push || true
